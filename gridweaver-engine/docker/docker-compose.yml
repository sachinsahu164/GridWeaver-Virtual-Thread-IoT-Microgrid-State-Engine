services:

  postgres:
    image: postgres:16
    container_name: gridweaver-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: gridweaver_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sachin@123

    ports:
      - "5432:5432"

    volumes:
      - gridweaver_postgres_data:/var/lib/postgresql/data

volumes:
  gridweaver_postgres_data: