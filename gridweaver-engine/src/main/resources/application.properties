spring.application.name=gridweaver-backend

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/gridweaver_db
spring.datasource.username=postgres
spring.datasource.password=sachin@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Server
# ===============================
server.port=8080

# ==========================================
# KAFKA
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

# ==========================================
# KAFKA CONSUMER
# ==========================================

spring.kafka.consumer.group-id=gridweaver-telemetry-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.gridweaver.gridweaver_engine.telemetry.dto

spring.kafka.consumer.properties.spring.json.value.default.type=com.gridweaver.gridweaver_engine.telemetry.dto.TelemetryRequest

spring.kafka.consumer.properties.spring.json.use.type.headers=false